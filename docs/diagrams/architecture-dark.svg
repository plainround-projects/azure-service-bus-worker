<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="t d">
<title id="t">A Service Bus worker that fails on purpose</title>
<desc id="d">The producer script order-produce sends commands to the queues orders and orders-sessions in the Service Bus namespace, using Azure Service Bus Data Sender. The order worker, order-worker or the container app ca-orders-worker, receives them under a peek-lock with Azure Service Bus Data Receiver and writes each to the SQLite ledger before it completes the message. When the lock expires first, the complete call fails and the queue delivers the message again. A poison message or one delivered ten times goes to the dead letters, which the replay tool order-dlq reads and resubmits to the queue with the original message id. The checker order-check reads the ledger. A warning note names the two demos make demo-duplicates and make demo-poison.</desc>
<style>
